<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre un versículo bíblico aleatorio de la Reina Valera 1960 y compártelo en tus redes sociales.">
    <meta name="author" content="Trigataro">
    <meta name="theme-color" content="#f3e9d2">
    <meta name="color-scheme" content="light">
    <title>Versículo Aleatorio</title>

    <!-- Icono del sitio -->
    <link rel="icon" type="image/png" sizes="16x16" href="Img/bible.png">
    <link rel="apple-touch-icon" href="Img/bible.png">

    <!-- Metadatos para redes sociales (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Versículo Aleatorio">
    <meta property="og:title" content="Versículo Aleatorio">
    <meta property="og:description" content="Descubre un versículo bíblico aleatorio de la Reina Valera 1960 y compártelo en tus redes sociales.">
    <meta property="og:image" content="Img/bible.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Icono de una Biblia">

    <!-- Metadatos para X (Twitter) -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Versículo Aleatorio">
    <meta name="twitter:description" content="Descubre un versículo bíblico aleatorio de la Reina Valera 1960 y compártelo en tus redes sociales.">
    <meta name="twitter:image" content="Img/bible.png">
    <meta name="twitter:image:alt" content="Icono de una Biblia">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="app-shell d-flex flex-column">
        <main class="flex-grow-1 d-flex align-items-center justify-content-center">
            <div class="container py-5">
                <div class="verse-card card border-0 shadow-lg mx-auto">
                    <div class="card-body p-4 p-md-5">
                        <header class="text-center mb-4">
                            <span class="brand-icon d-inline-flex align-items-center justify-content-center rounded-circle mb-3">
                                <i class="bi bi-book-half" aria-hidden="true"></i>
                            </span>
                            <h1 class="h3 fw-bold mb-1">Versículo Aleatorio</h1>
                            <p class="text-body-secondary mb-0">Un mensaje de la Palabra para hoy</p>
                        </header>

                        <div id="verse-container" class="verse-container text-center" aria-live="polite">
                            <p id="verse-reference" class="verse-reference text-uppercase fw-semibold mb-3">
                                Cargando…
                            </p>

                            <p id="verse-text" class="verse-text mb-3">
                                Espera un momento mientras se carga la Biblia.
                            </p>

                            <p id="verse-title" class="verse-title text-body-secondary fst-italic mb-0"></p>
                        </div>

                        <div id="verse-error" class="alert alert-danger mt-4 mb-0 d-none" role="alert"></div>

                        <div class="d-grid gap-2 col-10 col-sm-8 col-md-6 mx-auto mt-4">
                            <button id="refresh-button" type="button" class="btn btn-primary btn-lg rounded-pill px-4" disabled>
                                <i id="refresh-icon" class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>
                                <span id="refresh-label">Cargando…</span>
                            </button>

                            <div class="btn-group share-group" role="group" aria-label="Compartir el versículo">
                                <button id="share-button" type="button" class="btn btn-outline-primary btn-lg px-4 share-main" disabled>
                                    <i id="share-icon" class="bi bi-share me-2" aria-hidden="true"></i>
                                    <span id="share-label">Compartir versículo</span>
                                </button>

                                <button id="share-menu-button" type="button"
                                    class="btn btn-outline-primary btn-lg dropdown-toggle dropdown-toggle-split"
                                    data-bs-toggle="dropdown" aria-expanded="false" disabled>
                                    <span class="visually-hidden">Más opciones para compartir</span>
                                </button>

                                <ul class="dropdown-menu dropdown-menu-end share-menu shadow-sm">
                                    <li>
                                        <h2 class="dropdown-header h6 mb-1">Compartir en</h2>
                                    </li>
                                    <li>
                                        <a id="share-whatsapp" class="dropdown-item d-flex align-items-center gap-2"
                                            href="#" target="_blank" rel="noopener noreferrer">
                                            <i class="bi bi-whatsapp social-icon social-whatsapp" aria-hidden="true"></i>
                                            WhatsApp
                                        </a>
                                    </li>
                                    <li>
                                        <a id="share-facebook" class="dropdown-item d-flex align-items-center gap-2"
                                            href="#" target="_blank" rel="noopener noreferrer">
                                            <i class="bi bi-facebook social-icon social-facebook" aria-hidden="true"></i>
                                            Facebook
                                        </a>
                                    </li>
                                    <li>
                                        <a id="share-x" class="dropdown-item d-flex align-items-center gap-2"
                                            href="#" target="_blank" rel="noopener noreferrer">
                                            <i class="bi bi-twitter-x social-icon social-x" aria-hidden="true"></i>
                                            X (Twitter)
                                        </a>
                                    </li>
                                    <li>
                                        <a id="share-telegram" class="dropdown-item d-flex align-items-center gap-2"
                                            href="#" target="_blank" rel="noopener noreferrer">
                                            <i class="bi bi-telegram social-icon social-telegram" aria-hidden="true"></i>
                                            Telegram
                                        </a>
                                    </li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li>
                                        <button id="copy-verse" type="button" class="dropdown-item d-flex align-items-center gap-2">
                                            <i class="bi bi-clipboard social-icon" aria-hidden="true"></i>
                                            Copiar versículo y enlace
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <p id="share-feedback" class="share-feedback text-center small mt-3 mb-0" aria-live="polite"></p>

                        <p id="verse-status" class="visually-hidden" role="status"></p>
                    </div>

                    <div class="card-footer bg-transparent border-0 text-center pb-4">
                        <small class="text-body-secondary">Reina Valera 1960</small>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer text-center px-3 pb-4">
            <p class="mb-0">
                <a class="footer-link" href="https://github.com/TriGataro" target="_blank"
                    rel="noopener noreferrer" aria-label="Trigataro en GitHub" title="GitHub de Trigataro">
                    <strong class="fw-semibold">Trigataro</strong>
                    <i class="bi bi-github" aria-hidden="true"></i>
                </a>
            </p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
